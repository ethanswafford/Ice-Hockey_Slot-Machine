<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hat Trick Slots</title>

    <meta name="description" content="Hat Trick Slots - a hockey themed video slot game">

    <link rel="stylesheet" href="./css/index.css">
</head>

<body>

    <main class="game">

        <header class="game-header">
            <h1>HAT TRICK SLOTS</h1>

            <div id="game-message" class="game-message">
                WELCOME TO THE ICE
            </div>
        </header>


        <section class="slot-screen">

            <div id="reel-grid" class="reel-grid" aria-label="Hat Trick Slots reels">
            </div>

        </section>


        <section class="control-panel">

            <div class="meter">
                <span class="meter-label">CREDIT</span>
                <strong id="balance">1000</strong>
            </div>


            <div class="bet-controls">

                <button id="bet-decrease" class="control-button" type="button" aria-label="Decrease bet">
                    −
                </button>

                <div class="meter">
                    <span class="meter-label">BET</span>
                    <strong id="bet">10</strong>
                </div>

                <button id="bet-increase" class="control-button" type="button" aria-label="Increase bet">
                    +
                </button>

            </div>


            <div class="meter">
                <span class="meter-label">WIN</span>
                <strong id="win">0</strong>
            </div>


            <button id="spin" class="spin-button" type="button">
                SPIN
            </button>

        </section>

    </main>


    <script src="./js/app.js"></script>

</body>

</html>
